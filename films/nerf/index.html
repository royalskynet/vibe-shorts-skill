  { shot: 'clawd', st: 'thinking', tilt: .18 },        // 他們上週也這樣說。
  { shot: 'host', up: 1 },                              // 這篇有一萬個讚。
  { shot: 'clawd', st: 'happy' },                       // 一萬人都打「修一下」。
  { shot: 'wide', lean: 1 },                           // 那到底哪裡變了？
  { shot: 'wide', st: 'thinking' },                   // 昨天妳打了三百個字。
  { shot: 'host', droop: 1 },                           // 蛤，所以問題是我喔？
  { shot: 'clawd', st: 'happy' },                       // 妳說得完全正確。
  { shot: 'wide', frown: 1 },                          // 好啦，開新對話。
  { shot: 'wide', up: 1 },                              // Claude，你是不是被降智了？
  { shot: 'clawd', st: 'thinking', tilt: .18 },         // 對，我變笨了。
  { shot: 'host', up: 1 },                             // 我就知道！
  { shot: 'wide', st: 'happy', heart: 1 },            // 妳的「修一下」寫得很好。
];
if (PLAN.length !== N) throw new Error(`timeline.js 有 ${N} 句，分鏡 ${PLAN.length} 鏡，對不上`);
const T0 = TL.lines.map((l, i) => i === 0 ? 0 : l.t0 - .2);   // 換鏡在開口前 0.2 秒
const T1 = i => i + 1 < N ? T0[i + 1] : DUR;
const SEG = PLAN.map((p, i) => i === 0 || p.shot !== PLAN[i - 1].shot);   // true＝這句開新鏡（切）
const segStart = i => { while (i > 0 && !SEG[i]) i--; return i; };
const segEnd = i => { i++; while (i < N && !SEG[i]) i++; return i; };   // 下一個鏡段的第一句
const lineAt = t => { let i = 0; while (i + 1 < N && t >= T0[i + 1]) i++; return i; };
const WHO = TL.lines.map(l => l.who || 'host');
const speaking = (t, who) => TL.lines.some(l => (l.who || 'host') === who && t >= l.t0 && t <= l.t1);
const talk = t => .25 + .75 * Math.abs(Math.sin(t * 13.5)) * (.55 + .45 * Math.abs(Math.sin(t * 4.3 + 1)));

// Claude狀態軌：說話的句子用 PLAN 的狀態，女主說話時回 idle 並看向女主
const TRACK = {
  fps: 30,
  states: PLAN.map((p, i) => ({ t: T0[i], state: WHO[i] === 'clawd' ? (p.st || 'idle') : 'idle' })),
  looks: PLAN.map((p, i) => ({ t: T0[i], x: WHO[i] === 'clawd' ? 0 : .7, y: WHO[i] === 'clawd' ? 0 : -.5 })),
  pokes: [],
};

// 一個值從上一句的目標平滑走到這一句的目標（0.35 秒），封閉式
function track(t, f) {
  const i = lineAt(t), prev = i ? f(PLAN[i - 1], i - 1) : f(PLAN[0], 0);
  return lerp(prev, f(PLAN[i], i), ease((t - T0[i]) / .35));
}

function poseHost(t) {
  const i = lineAt(t), p = PLAN[i], u = clamp((t - T0[i]) / (T1(i) - T0[i]), 0, 1);
  const nod = p.nod ? Math.sin(u * Math.PI * 2) * .12 : 0;
  host.head.rotation.x = track(t, q => (q.droop ? .3 : q.up ? -.12 : 0)) + nod + Math.sin(t * 1.1) * .02;
  host.head.rotation.y = track(t, (q, j) => WHO[j] === 'clawd' ? -.28 : -.1) + Math.sin(t * .7) * .03;
  host.head.rotation.z = Math.sin(t * .9) * .03;
  host.body.rotation.x = track(t, q => q.lean ? .12 : 0);
  const ex = track(t, (q, j) => q.eyeX ? .45 : WHO[j] === 'clawd' ? -.3 : 0);
  const blink = ((t + .37) % 3.3) < .12;
  for (const e of host.eyes) { e.position.x = Math.sign(e.position.x) * 3.3 + ex; e.scale.y = blink ? .12 : 1; }
  const fr = track(t, q => q.frown ? 1 : 0);
  host.brows.forEach((b, k) => { b.rotation.z = (k ? -1 : 1) * fr * .35; b.position.y = 2.6 - fr * .3; });
  host.mouth.scale.y = speaking(t, 'host') ? 1 + 2.4 * talk(t) : 1;
}

function poseClawd(t) {
  const P = poseAt(t, TRACK), i = lineAt(t), p = PLAN[i];
  clawd.actor.position.y = -P.bobY * K;
  clawd.actor.scale.set(P.scaleX, P.scaleY, P.scaleX);
  clawd.actor.rotation.z = track(t, q => q.tilt || 0);
  clawd.shadow.scale.setScalar(P.shadowRx * K * 1.05);
  clawd.face.position.x = P.face.x * K; clawd.face.position.y = -P.face.y * K;
  clawd.spark.rotation.z = -P.sparkRot * Math.PI / 180;
  const happy = P.state === 'happy', think = P.state === 'thinking';
  clawd.eyesN.forEach(e => e.visible = !happy);
  clawd.eyesH.forEach(e => e.visible = happy);
  clawd.smile.visible = !think; clawd.flat.visible = think;
  const tk = speaking(t, 'clawd') ? talk(t) : 0;
  clawd.smile.scale.set(1, 1 + tk * 1.6, 1); clawd.flat.scale.set(1, 1 + tk * 2.5, 1);
  // 雙螯：pose 給的 svg 座標；抱胸用 PLAN 覆寫
  const hug = track(t, q => q.hug ? 1 : 0);
  [P.clawL, P.clawR].forEach((c, k) => {
    const s = k ? 1 : -1, g = clawd.claws[k];
    g.position.set(lerp(c.x * K, s * 4.2, hug), lerp(Y(c.y), Y(30), hug), lerp(.6, 5.2, hug));
    g.rotation.z = -c.rot * Math.PI / 180;
  });
  // 愛心：那句講到一半冒出來往上飄
  const hi = PLAN.findIndex(q => q.heart);
  const hu = clamp((t - T0[hi] - .4) / 1.6, 0, 1);
  clawd.heart.visible = t >= T0[hi] + .4;
  clawd.heart.position.set(2.5, Y(-70) + hu * 3, 1);
  clawd.heart.scale.setScalar(ease(hu * 3) * (1 + .08 * Math.sin(t * 9)));
  clawd.heartM.opacity = 1 - ease((hu - .7) / .3);
  // 螢幕：錯誤條在 err 那句 0.3 秒後出現；clear 那句 0.3 秒後全部清空
  const ei = PLAN.findIndex(q => q.screen === 'err'), ci = PLAN.findIndex(q => q.screen === 'clear');
  const cleared = t >= T0[ci] + .3;
  ERR.visible = t >= T0[ei] + .3 && !cleared;
  CODE.forEach(o => o.visible = !cleared);
}

function cam(t) {
  // 一個鏡段內一路慢慢推近，只在換鏡段時切；全部是 t 的封閉式函數
  const i = lineAt(t), s = SHOT[PLAN[i].shot], a = segStart(i), b = segEnd(i);
  const u = ease((t - T0[a]) / ((b < N ? T0[b] : DUR) - T0[a]));
  let lean = V(0, 0, 0);
  if (PLAN[i].shot === 'wide' && i > a) lean = LEAN[WHO[i - 1]].clone().lerp(LEAN[WHO[i]], ease((t - T0[i]) / .8));
  else if (PLAN[i].shot === 'wide') lean = LEAN[WHO[i]].clone();
  const d = s.pos.clone().sub(s.to).multiplyScalar(1 - s.push * u);
  camera.position.copy(s.to).add(d).add(lean);
  camera.position.x += Math.sin(t * .23) * .6;   // 慢速左右漂
  camera.position.y += Math.sin(t * .8) * .12;   // 手持感的微晃
  camera.fov = s.fov; camera.updateProjectionMatrix();
  camera.lookAt(s.to.clone().add(lean.multiplyScalar(.6)));
  post.dof.focus = camera.position.distanceTo(s.focus); post.dof.aper = s.aper; post.dof.maxCoc = 16;
}

// ---------- 字幕（參考片：白字、置中偏上、無底框） ----------
const ov = document.getElementById('ov').getContext('2d');
const FONT = '600 60px "PingFang TC"';
let TXT = [];
function caption(t) {
  ov.clearRect(0, 0, W, H);
  // 第一句從第 0 幀就顯示：第 0 幀是 IG／Threads 封面，要帶到鉤子句
  const L = TL.lines.find((l, i) => t >= (i ? l.t0 - .1 : 0) && t < l.t1 + .25);
  if (!L) return;
  const s = L.text.replace(/[。！]$/, ''), maxW = 900;
  ov.font = FONT; ov.textAlign = 'center'; ov.textBaseline = 'alphabetic';
  const fits = r => ov.measureText(r).width <= maxW;
  let rows = [s];
  if (!fits(s)) {
    const cuts = [...s.matchAll(/[，、]/g)].map(m => m.index + 1).filter(c => fits(s.slice(0, c)) && fits(s.slice(c)));
    const cut = cuts.length ? cuts.reduce((a, c) => Math.abs(c - s.length / 2) < Math.abs(a - s.length / 2) ? c : a) : Math.ceil(s.length / 2);
    rows = [s.slice(0, cut), s.slice(cut)];
  }
  rows.forEach((r, j) => {
    const y = 700 + j * 80, w = ov.measureText(r).width;
    ov.shadowColor = 'rgba(0,0,0,.75)'; ov.shadowBlur = 14; ov.shadowOffsetY = 3;
    ov.fillStyle = '#ffffff'; ov.fillText(r, W / 2, y);
    ov.shadowColor = 'transparent';
    TXT.push({ id: 'cap', text: r, x0: W / 2 - w / 2, y0: y - 60, x1: W / 2 + w / 2, y1: y + 15, screen: true });
  });
}

function render(t) {
  t = clamp(t, 0, DUR); TXT = [];
  poseHost(t); poseClawd(t); cam(t);
  // 不從黑淡入：第 0 幀是 IG／Threads 封面（precheck「封面幀」）
  const fade = 1 - ease((t - (DUR - .6)) / .6);
  post.vig.uniforms.fade.value = fade;
  post.composer.render();
  caption(t);
}

// ---------- 對外契約（lemo core/render、scripts/*_check） ----------
window.DUR = DUR;
window.render = render;
window.TEXTS = t => { render(t); return TXT.filter(b => b.screen); };
window.CUES = TL.lines.map(l => ({ t0: l.t0, t1: l.t1, text: l.text }));
window.SHAKES = [];
window.EV = (() => {
  const e = [{ t: 0, type: 'bed', len: DUR }];
  PLAN.forEach((p, i) => {
    if (i && SEG[i]) e.push({ t: T0[i], type: 'cut' });
    if (WHO[i] === 'clawd' && (p.st === 'happy' || p.st === 'thinking')) e.push({ t: T0[i] + .25, type: 'blip' });
    if (p.screen) e.push({ t: T0[i] + .3, type: 'click' });
  });
  e.push({ t: T0[N - 1] + .2, type: 'chime' });
  return e.sort((a, b) => a.t - b.t);
})();
window.VOICE = TL.lines.map((l, j) => ({ t: l.t0, file: `out/voice/${String(j + 1).padStart(2, '0')}.wav` }));
window.DBG = { camera, post, host, clawd, SHOT, PLAN, T0 };

await document.fonts.load(FONT, TL.lines.map(l => l.text).join(''));
await document.fonts.ready;
render(0); render(DUR / 2); render(0);   // 先把每種材質與陰影圖編譯好，冷啟動 worker 的首幀才跟接續畫的一樣
window.READY = true;
</script>
</body>
