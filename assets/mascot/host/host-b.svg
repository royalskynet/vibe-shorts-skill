<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -140 240 240" width="480" height="480" id="host-b-svg">
  <!-- 主持人候選 b：長直髮＋西裝外套。色票與 Clawd Bot 同一套（assets/mascot/clawd-bot/README.md §2） -->
  <ellipse id="shadow" cx="0" cy="92" rx="56" ry="8" fill="rgba(31,30,29,0.12)"/>
  <g id="actor">
<g id="hair-sway-l" transform="translate(-58,-10)"><path d="M0,0 C-10,24 -10,52 -4,74 L10,70 C4,48 4,22 10,-2 Z" fill="#BC5C3E" stroke="#252422" stroke-width="2.6" stroke-linejoin="round"/></g>
       <g id="hair-sway-r" transform="translate(58,-10)"><path d="M0,0 C10,24 10,52 4,74 L-10,70 C-4,48 -4,22 -10,-2 Z" fill="#BC5C3E" stroke="#252422" stroke-width="2.6" stroke-linejoin="round"/></g>
<path d="M0,-110 C42,-110 64,-84 64,-46 C64,-6 60,34 58,62 L36,62 C40,26 42,-10 40,-44 C30,-36 -30,-36 -40,-44 C-42,-10 -40,26 -36,62 L-58,62 C-60,34 -64,-6 -64,-46 C-64,-84 -42,-110 0,-110 Z" fill="#D97757" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
<g id="body">
    <path d="M-64,86 C-64,42 -36,16 0,16 C36,16 64,42 64,86 Z" fill="#2B2825" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M-30,20 L0,52 L30,20 L22,16 L0,38 L-22,16 Z" fill="#F4EAE2" stroke="#252422" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M-30,20 L-14,86 L-2,86 L-10,46 Z" fill="#D97757" stroke="#252422" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M30,20 L14,86 L2,86 L10,46 Z" fill="#D97757" stroke="#252422" stroke-width="2.4" stroke-linejoin="round"/>
  </g>

  <!-- 頸與肩的交界先畫，避免描邊疊在臉上 -->
  <path id="neck" d="M-13,-18 L-13,6 Q0,14 13,6 L13,-18 Z" fill="#EFCBB6" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
  <g id="head">
    <path id="face" d="M0,-96 C34,-96 50,-72 50,-44 C50,-12 30,10 0,10 C-30,10 -50,-12 -50,-44 C-50,-72 -34,-96 0,-96 Z"
          fill="#F8E2D2" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
    <!-- 耳 -->
    <path d="M-50,-50 C-58,-50 -60,-38 -52,-34" fill="#F8E2D2" stroke="#252422" stroke-width="2.4"/>
    <path d="M50,-50 C58,-50 60,-38 52,-34" fill="#F8E2D2" stroke="#252422" stroke-width="2.4"/>
    <g id="face-parts">
      <!-- 腮紅 -->
      <ellipse cx="-28" cy="-34" rx="9" ry="4.5" fill="#FF856D" opacity="0.55"/>
      <ellipse cx="28" cy="-34" rx="9" ry="4.5" fill="#FF856D" opacity="0.55"/>
      <!-- 眉 -->
      <g id="brows" stroke="#BC5C3E" stroke-width="3.4" stroke-linecap="round" fill="none">
        <path d="M-30,-58 Q-21,-62 -12,-59"/>
        <path d="M12,-59 Q21,-62 30,-58"/>
      </g>
      <!-- 睜眼（預設） -->
      <g id="eyes-open">
        <g>
          <ellipse cx="-21" cy="-44" rx="10" ry="12.5" fill="#3A3632"/>
          <circle cx="-24" cy="-49" r="3.6" fill="#FFFFFF"/>
          <circle cx="-18" cy="-39" r="2.2" fill="#68E399"/>
          <path d="M-32,-54 Q-21,-60 -10,-54" stroke="#252422" stroke-width="3.6" fill="none" stroke-linecap="round"/>
        </g>
        <g>
          <ellipse cx="21" cy="-44" rx="10" ry="12.5" fill="#3A3632"/>
          <circle cx="18" cy="-49" r="3.6" fill="#FFFFFF"/>
          <circle cx="24" cy="-39" r="2.2" fill="#68E399"/>
          <path d="M10,-54 Q21,-60 32,-54" stroke="#252422" stroke-width="3.6" fill="none" stroke-linecap="round"/>
        </g>
      </g>
      <!-- 半閉與閉眼：眨眼與思考用，動畫層切 display -->
      <g id="eyes-half" style="display:none" stroke="#252422" stroke-width="3.6" fill="none" stroke-linecap="round">
        <path d="M-32,-48 Q-21,-54 -10,-48"/>
        <path d="M10,-48 Q21,-54 32,-48"/>
        <path d="M-30,-44 Q-21,-40 -12,-44" stroke="#3A3632" stroke-width="5"/>
        <path d="M12,-44 Q21,-40 30,-44" stroke="#3A3632" stroke-width="5"/>
      </g>
      <g id="eyes-closed" style="display:none" stroke="#252422" stroke-width="3.6" fill="none" stroke-linecap="round">
        <path d="M-31,-45 Q-21,-38 -11,-45"/>
        <path d="M11,-45 Q21,-38 31,-45"/>
      </g>
      <!-- 鼻與嘴（嘴由動畫層換 d，對口型） -->
      <path d="M0,-34 L3,-30" stroke="#252422" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path id="mouth" d="M-7,-22 Q0,-16 7,-22" stroke="#252422" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

<path d="M-46,-56 C-44,-94 -18,-106 0,-106 C20,-106 46,-94 46,-54 C38,-78 22,-86 2,-84 C-16,-86 -34,-76 -46,-56 Z" fill="#F29172" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
       <path d="M-2,-84 C-4,-72 -2,-62 2,-56" stroke="#BC5C3E" stroke-width="2.6" fill="none"/>
  </g>
  <g id="fx"></g>
</svg>
