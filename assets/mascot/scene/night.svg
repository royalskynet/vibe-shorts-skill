    <path d="M-8,40 L-10,66" stroke="#F6B966" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M8,40 L10,66" stroke="#F6B966" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="0" cy="62" r="5" fill="#68E399" stroke="#252422" stroke-width="2.2"/>
  </g>

  <!-- 頸與肩的交界先畫，避免描邊疊在臉上 -->
  <path id="host-neck" d="M-13,-18 L-13,6 Q0,14 13,6 L13,-18 Z" fill="#EFCBB6" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
  <g id="host-head">
