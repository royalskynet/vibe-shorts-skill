  <!-- Clawd Bot（坐在桌上） -->
  <svg x="600" y="960" width="380" height="380" viewBox="-120 -120 240 240" overflow="visible">
  <defs>
    <linearGradient id="clawd-mechaBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F29172"/>
      <stop offset="60%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#BC5C3E"/>
    </linearGradient>
    <filter id="clawd-softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#D97757" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse id="clawd-shadow" cx="0" cy="80" rx="50" ry="10" fill="rgba(31,30,29,0.1)"/>

  <g id="clawd-actor" filter="url(#clawd-softGlow)">
    <!-- Symmetrical Center Antenna (Claude Spark Signal) -->
    <g id="clawd-crab-antenna" transform="translate(0, -56)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#252422" stroke-width="4" stroke-linecap="round"/>
      <g id="clawd-crab-spark" transform="translate(0, -6)">
        <path d="M0,-12 C2.5,-3 3,-2.5 12,0 C3,2.5 2.5,3 0,12 C-2.5,3 -3,2.5 -12,0 C-3,-2.5 -2.5,-3 0,-12 Z" fill="#F6B966"/>
      </g>
    </g>

    <!-- Symmetrical Minimalist Mechanical Legs (2 pairs of clean rounded capsules) -->
    <g id="clawd-crab-legs">
      <rect id="clawd-leg-l-1" x="-44" y="34" width="11" height="24" rx="5.5" fill="#252422" transform="rotate(18 -38 38)"/>
      <rect id="clawd-leg-r-1" x="33" y="34" width="11" height="24" rx="5.5" fill="#252422" transform="rotate(-18 38 38)"/>
      <rect id="clawd-leg-l-2" x="-26" y="38" width="11" height="22" rx="5.5" fill="#252422" transform="rotate(8 -20 42)"/>
      <rect id="clawd-leg-r-2" x="15" y="38" width="11" height="22" rx="5.5" fill="#252422" transform="rotate(-8 20 42)"/>
    </g>

    <!-- Symmetrical Floating C-Claws (Left & Right) -->
    <g id="clawd-claw-l" transform="translate(-66, 2)">
      <path d="M8,-16 A18,18 0 1,0 8,16 L2,8 A8,8 0 1,1 2,-8 Z" fill="url(#clawd-mechaBodyGrad)" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
    </g>
    <g id="clawd-claw-r" transform="translate(66, 2)">
      <path d="M-8,-16 A18,18 0 1,1 -8,16 L-2,8 A8,8 0 1,0 -2,-8 Z" fill="url(#clawd-mechaBodyGrad)" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
    </g>

    <!-- Unified Smooth Pill-Dome Mecha Body (100% Left-Right Symmetrical) -->
    <rect id="clawd-crab-body" x="-52" y="-38" width="104" height="82" rx="41" fill="url(#clawd-mechaBodyGrad)" stroke="#252422" stroke-width="3.5"/>
    <path d="M-32,-26 Q0,-34 32,-26" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Symmetrical Smart Visor Screen -->
    <rect id="clawd-crab-visor" x="-38" y="-20" width="76" height="44" rx="22" fill="#201F1D" stroke="#3A3632" stroke-width="2"/>

    <!-- LED Face inside Visor -->
    <g id="clawd-face">
      <!-- LED Blush Bars -->
      <rect x="-29" y="8" width="9" height="4" rx="2" fill="#FF856D" opacity="0.85"/>
      <rect x="20" y="8" width="9" height="4" rx="2" fill="#FF856D" opacity="0.85"/>

      <!-- Normal LED Eyes -->
      <g id="clawd-eyes-normal">
        <rect x="-22" y="-9" width="10" height="14" rx="5" fill="#68E399"/>
        <rect x="12" y="-9" width="10" height="14" rx="5" fill="#68E399"/>
      </g>

      <!-- Happy LED Arcs -->
      <g id="clawd-eyes-happy" style="display:none" stroke="#68E399" stroke-width="4" stroke-linecap="round" fill="none">
        <path d="M-23,0 Q-17,-9 -11,0"/>
        <path d="M11,0 Q17,-9 23,0"/>
      </g>

      <!-- Sleep / Error LED Lines -->
      <g id="clawd-eyes-sleep" style="display:none" stroke="#FF8577" stroke-width="3.5" stroke-linecap="round" fill="none">
        <line x1="-23" y1="-2" x2="-11" y2="-2"/>
        <line x1="11" y1="-2" x2="23" y2="-2"/>
      </g>

      <!-- Minimalist LED Mouth -->
      <path id="clawd-mouth" d="M-5,7 Q0,11 5,7" stroke="#68E399" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <g id="clawd-fx"></g>
</svg>

  <!-- 一句一卡字幕：說話者名字用角色色（女主＝橘、Clawd＝LED 綠） -->
  <g>
    <rect x="90" y="1480" width="900" height="210" rx="34" fill="#141312" opacity="0.92" stroke="#3A3632" stroke-width="3"/>
    <text x="140" y="1546" font-family="PingFang TC" font-size="36" font-weight="600" fill="#F29172">她</text>
    <text x="140" y="1630" font-family="PingFang TC" font-size="60" font-weight="600" fill="#F4EAE2">你又忘了我們昨天聊過什麼？</text>
  </g>

  <!-- 時間戳：深夜感 -->
  <text x="540" y="130" text-anchor="middle" font-family="Menlo" font-size="40" fill="#F6B966" opacity="0.85">01:24 AM</text>
</svg>
