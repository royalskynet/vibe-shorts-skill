      <g id="host-eyes-closed" style="display:none" stroke="#252422" stroke-width="3.6" fill="none" stroke-linecap="round">
        <path d="M-31,-45 Q-21,-38 -11,-45"/>
        <path d="M11,-45 Q21,-38 31,-45"/>
      </g>
      <!-- 鼻與嘴（嘴由動畫層換 d，對口型） -->
      <path d="M0,-34 L3,-30" stroke="#252422" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path id="host-mouth" d="M-7,-22 Q0,-16 7,-22" stroke="#252422" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

<path d="M-44,-58 C-40,-92 -16,-104 0,-104 C18,-104 42,-92 44,-56 C34,-74 20,-82 6,-80 C10,-72 8,-64 4,-58 C-6,-74 -26,-76 -44,-58 Z" fill="#F29172" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
