  <!-- 女主（桌子後面，半身） -->
  <svg x="20" y="640" width="700" height="700" viewBox="-120 -140 240 240" overflow="visible">
  <!-- 主持人候選 a：短鮑伯＋連帽衫。色票與 Clawd Bot 同一套（assets/mascot/clawd-bot/README.md §2） -->
  <ellipse id="host-shadow" cx="0" cy="92" rx="56" ry="8" fill="rgba(31,30,29,0.12)"/>
  <g id="host-actor">
<g id="host-hair-sway-l" transform="translate(-52,-52)"><path d="M0,0 C-8,10 -10,22 -6,32 L6,28 C2,18 2,8 8,-2 Z" fill="#BC5C3E" stroke="#252422" stroke-width="2.6" stroke-linejoin="round"/></g>
       <g id="host-hair-sway-r" transform="translate(52,-52)"><path d="M0,0 C8,10 10,22 6,32 L-6,28 C-2,18 -2,8 -8,-2 Z" fill="#BC5C3E" stroke="#252422" stroke-width="2.6" stroke-linejoin="round"/></g>
<path d="M0,-108 C40,-108 62,-82 62,-46 C62,-18 56,2 52,14 L34,8 C40,-10 42,-28 40,-44 C30,-36 -30,-36 -40,-44 C-42,-28 -40,-10 -34,8 L-52,14 C-56,2 -62,-18 -62,-46 C-62,-82 -40,-108 0,-108 Z" fill="#D97757" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
<g id="host-body">
