<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clawd Bot（智能機械蟹）— 角色綁定與狀態預覽台</title>
  <style>
    :root {
      --bg: #FAF8F5;
      --card-bg: #FFFFFF;
      --border: #EBE5DC;
      --text-main: #1F1E1D;
      --text-sub: #6E6A63;
      --claude-orange: #D97757;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .stage-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 12px 32px rgba(31, 30, 29, 0.06);
    }

    .stage-card.chroma {
      background: #00FF00;
    }

    svg {
      width: 320px;
      height: 320px;
      cursor: pointer;
      overflow: visible;
    }

    h1 {
      font-size: 1.35rem;
      margin-top: 8px;
      margin-bottom: 6px;
    }

    p {
      font-size: 0.88rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 20px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    button {
      border: 1px solid var(--border);
      background: #F5F1EA;
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 99px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    button.active {
      background: var(--claude-orange);
      color: #FFF;
      border-color: var(--claude-orange);
    }
  </style>
</head>
<body>

  <div class="stage-card" id="stage-card">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240" id="clawd-bot-svg">
      <defs>
        <linearGradient id="mechaBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#F29172"/>
          <stop offset="60%" stop-color="#D97757"/>
          <stop offset="100%" stop-color="#BC5C3E"/>
        </linearGradient>
        <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#D97757" flood-opacity="0.22"/>
        </filter>
      </defs>

      <ellipse id="shadow" cx="0" cy="80" rx="50" ry="10" fill="rgba(31,30,29,0.1)"/>

      <g id="actor" filter="url(#softGlow)">
        <g id="crab-antenna" transform="translate(0, -56)">
          <line x1="0" y1="0" x2="0" y2="16" stroke="#252422" stroke-width="4" stroke-linecap="round"/>
          <g id="crab-spark" transform="translate(0, -6)">
            <path d="M0,-12 C2.5,-3 3,-2.5 12,0 C3,2.5 2.5,3 0,12 C-2.5,3 -3,2.5 -12,0 C-3,-2.5 -2.5,-3 0,-12 Z" fill="#F6B966"/>
          </g>
        </g>

        <g id="crab-legs">
          <rect id="leg-l-1" x="-44" y="34" width="11" height="24" rx="5.5" fill="#252422" transform="rotate(18 -38 38)"/>
          <rect id="leg-r-1" x="33" y="34" width="11" height="24" rx="5.5" fill="#252422" transform="rotate(-18 38 38)"/>
          <rect id="leg-l-2" x="-26" y="38" width="11" height="22" rx="5.5" fill="#252422" transform="rotate(8 -20 42)"/>
          <rect id="leg-r-2" x="15" y="38" width="11" height="22" rx="5.5" fill="#252422" transform="rotate(-8 20 42)"/>
        </g>

        <g id="claw-l" transform="translate(-66, 2)">
          <path d="M8,-16 A18,18 0 1,0 8,16 L2,8 A8,8 0 1,1 2,-8 Z" fill="url(#mechaBodyGrad)" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
        </g>
        <g id="claw-r" transform="translate(66, 2)">
          <path d="M-8,-16 A18,18 0 1,1 -8,16 L-2,8 A8,8 0 1,0 -2,-8 Z" fill="url(#mechaBodyGrad)" stroke="#252422" stroke-width="3.2" stroke-linejoin="round"/>
        </g>

        <rect id="crab-body" x="-52" y="-38" width="104" height="82" rx="41" fill="url(#mechaBodyGrad)" stroke="#252422" stroke-width="3.5"/>
        <path d="M-32,-26 Q0,-34 32,-26" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round" fill="none"/>

        <rect id="crab-visor" x="-38" y="-20" width="76" height="44" rx="22" fill="#201F1D" stroke="#3A3632" stroke-width="2"/>

        <g id="face">
          <rect x="-29" y="8" width="9" height="4" rx="2" fill="#FF856D" opacity="0.85"/>
          <rect x="20" y="8" width="9" height="4" rx="2" fill="#FF856D" opacity="0.85"/>

          <g id="eyes-normal">
            <rect x="-22" y="-9" width="10" height="14" rx="5" fill="#68E399"/>
            <rect x="12" y="-9" width="10" height="14" rx="5" fill="#68E399"/>
          </g>

          <g id="eyes-happy" style="display:none" stroke="#68E399" stroke-width="4" stroke-linecap="round" fill="none">
            <path d="M-23,0 Q-17,-9 -11,0"/>
            <path d="M11,0 Q17,-9 23,0"/>
          </g>

          <g id="eyes-sleep" style="display:none" stroke="#FF8577" stroke-width="3.5" stroke-linecap="round" fill="none">
            <line x1="-23" y1="-2" x2="-11" y2="-2"/>
            <line x1="11" y1="-2" x2="23" y2="-2"/>
          </g>

          <path id="mouth" d="M-5,7 Q0,11 5,7" stroke="#68E399" stroke-width="2.8" stroke-linecap="round" fill="none"/>
        </g>
      </g>

      <g id="fx"></g>
    </svg>

    <h1>【智能機械蟹】Clawd Bot</h1>
    <p>vibe-shorts 常用角色標準綁定（點擊角色可觸發 Q 彈反應）</p>

    <div class="controls">
      <button class="state-btn active" data-state="idle">✨ 待機 (Idle)</button>
      <button class="state-btn" data-state="thinking">🧠 思考 (Thinking)</button>
      <button class="state-btn" data-state="happy">🎉 開心 (Happy)</button>
      <button class="state-btn" data-state="sleep">💤 休眠 (Sleep)</button>
    </div>
  </div>

  <script type="module">
    import { ClawdBotRig } from './clawd-bot-rig.js';

    const svg = document.getElementById('clawd-bot-svg');
    const rig = new ClawdBotRig(svg);

    svg.addEventListener('click', () => rig.poke());

    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / window.innerWidth) * 2 - 1;
      const ny = (e.clientY / window.innerHeight) * 2 - 1;
      rig.setLookAt(nx, ny);
    });

    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        rig.setState(btn.dataset.state);
      });
    });

    function loop(now) {
      rig.tick(now * 0.001);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
